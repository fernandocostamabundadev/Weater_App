<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast Day - Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
<body>
  <!--  fundo animado de nuvens -->
  <div class="clouds">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>
   <!--  container principal -->
   <div class="container">
      <!--  cabeçalho -->
      <header class="header">
        <div class="logo">
          <span class="logo-icon">🌤️</span>
          <h1>Weather Forecast Day</h1>
        </div>
        <p class="subtitle">Previsão do tempo para os próximos 5 dias</p>
        <div class="theme-switcher">
          <label class="theme-toggle" for="themeToggle">
            <input
              type="checkbox"
              id="themeToggle"
              aria-label="Alternar tema claro e escuro"
            />
            <span class="slider"></span>
          </label>
          <span id="themeLabel" class="theme-label">Modo Escuro</span>
        </div>
      </header>
    <div>
    <!--  barra de busca -->
    <div class="search-section">
        <div class="search-box">
          <label for="locationInput" class="visually-hidden"
            >Cidade, estado ou CEP</label
          >
          <input
            type="text"
            id="locationInput"
            class="search-input"
            placeholder="Digite a cidade (ex: São Paulo, SP, Brasil)"
            autocomplete="off"
            list="locationSuggestions"
          />
          <datalist id="locationSuggestions"></datalist>
          <button id="searchBtn" class="search-btn" type="button">
            <span class="search-icon">🔍</span>
            Buscar
          </button>
          <button
            id="geoBtn"
            class="geo-btn"
            type="button"
            aria-label="Buscar previsão na minha localização"
          >
            📍
          </button>
        </div>
      </div>
      <div
        id="recentSection"
        class="recent-section hidden"
        aria-label="Pesquisas recentes"
      >
        <h2>Pesquisas recentes</h2>
        <div id="recentButtons" class="history-buttons"></div>
      </div>
      <div
        id="favoritesSection"
        class="favorites-section hidden"
        aria-label="Locais favoritos"
      >
        <h2>Locais favoritos</h2>
        <div id="favoriteButtons" class="history-buttons"></div>
      </div>
    <!--  spinner de carregamento -->
    <div id="loading" class="loading hidden" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Carregando previsão... ⏳</p>
      </div>
    <!--  mensagem de erro -->
    <!--  informações da localização -->
    <!--  botões de compartilhamento -->
    <!--  rodapé -->
  <script type="module" src="script.js"></script>
</body>
</html>
